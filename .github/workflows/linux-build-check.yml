name: Linux Build Check

# Builds the Linux desktop bundles (.AppImage / .deb / .rpm) and uploads them
# as downloadable Actions artifacts — WITHOUT creating a GitHub release or
# nudging desktop users (release.yml is tag-only; this never tags). Use it to
# (a) confirm the Tauri 2 Linux build actually compiles + bundles before a real
# release, and (b) hand a build to a tester.
#
# Triggers: automatically on push to the feature branch, or manually via the
# Actions tab once this file is on the default branch (workflow_dispatch only
# shows the "Run workflow" button for workflows present on the default branch).
#
# Download the artifact from the run's summary page, unzip, and the .AppImage
# can be run directly after `chmod +x`. This whole file can be deleted once the
# Linux build is proven and shipping via release.yml.
# Least-privilege: this workflow only builds + uploads Actions artifacts; it
# never creates a release, so a read-only token is sufficient.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-desktop-build

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same Tauri 2 dependency set as release.yml's Linux row.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend with Tauri flag
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: linux

      # No tagName/releaseName → tauri-action builds the bundles but does NOT
      # publish a release. Bundles land in src-tauri/target/release/bundle/.
      - name: Build the Linux app (no release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_PLATFORM: linux

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: 3dcoster-linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
