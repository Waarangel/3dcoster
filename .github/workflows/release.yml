name: Release

# Triggers only on 3-part semver tags (e.g. v1.3.2, v2.0.0). 2-part tags
# (e.g. v1.3) are GSD milestone markers — planning artifacts that must NOT
# trigger a Tauri desktop build. Without this restriction, pushing the v1.3
# GSD milestone tag (2026-05-28) accidentally created a v1.3 GitHub release
# with mis-labeled v1.3.1 assets — see CHANGELOG.md 1.3.1 entry for the fix.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            tauri_platform: 'darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            tauri_platform: 'darwin'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            tauri_platform: 'windows'
          # Linux: pin ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest. The build
          # bakes in a glibc floor equal to the runner's, so a 24.04 build
          # (glibc 2.39) would silently fail to launch on 22.04-era distros
          # with "GLIBC_2.39 not found". 22.04 also ships libwebkit2gtk-4.1
          # (which Tauri 2 requires) and is the runner the official
          # tauri-action example uses. empty args + bundle.targets "all"
          # (tauri.conf.json) yields .AppImage + .deb + .rpm.
          - platform: 'ubuntu-22.04'
            args: ''
            tauri_platform: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tauri 2 on Linux links against WebKitGTK 4.1 and needs librsvg +
      # patchelf for AppImage bundling. Gated to the Linux row so the macOS
      # and Windows runners skip it entirely. This is the canonical
      # tauri-action dependency list.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG.md
        # Reads the section matching the pushed tag from CHANGELOG.md and
        # stuffs the body into $GITHUB_ENV as a multi-line var. If no section
        # is found, the script emits a fallback body + a loud stderr warning
        # that surfaces in the build log (soft gate — never blocks shipping).
        # See scripts/extract-changelog.cjs for full behavior.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="$(node scripts/extract-changelog.cjs "$TAG")"
          {
            echo "RELEASE_BODY<<RELEASE_BODY_EOF_3DCOSTER"
            echo "$NOTES"
            echo "RELEASE_BODY_EOF_3DCOSTER"
          } >> "$GITHUB_ENV"

      - name: Build frontend with Tauri flag
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: ${{ matrix.tauri_platform }}

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_PLATFORM: ${{ matrix.tauri_platform }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '3DCoster ${{ github.ref_name }}'
          # Body comes from CHANGELOG.md via the "Extract release notes" step
          # above. To add notes for the next release, append a section to
          # CHANGELOG.md BEFORE pushing the tag. See .claude/CLAUDE.md
          # "Desktop App Release Process" for the rule.
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Posts the release notes to the community Discord after all platform
  # builds finish. This job lives HERE (not behind discord-notify.yml's
  # `release: published` trigger) because tauri-action creates the release
  # with the workflow's GITHUB_TOKEN, and events created by GITHUB_TOKEN
  # never trigger other workflows (GitHub's recursion guard) — learned the
  # hard way when v1.6.0 published silently. discord-notify.yml remains for
  # manual/retroactive posts. Soft gate: missing webhook secret warns and
  # skips; a Discord outage never fails the release.
  notify-discord:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Post release notes to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK secret not set — skipping Discord changelog post."
            exit 0
          fi

          NOTES="$(node scripts/extract-changelog.cjs "$TAG")"

          BODY="$(printf '%s\n' "$NOTES" \
            | sed '/^## Download$/,$d' \
            | sed "s/^## What's New\$//" \
            | sed 's/^---$//' \
            | sed -E 's/^### (.*)$/**\1**/' \
            | head -c 3900)"

          jq -n \
            --arg title "3DCoster $TAG is out" \
            --arg desc "$BODY" \
            --arg url "https://github.com/$REPO/releases/tag/$TAG" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 3447003}]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
            && echo "Posted $TAG release notes to Discord." \
            || echo "::warning::Discord post failed (webhook rejected or unreachable) — release is unaffected."
